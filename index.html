<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SOS Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
:root{
  --bg:#f4f3f1; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2de;
  --brand:#1d1d1f; --accent:#e4572e; --accent-soft:#fde9e3;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#b26a00; --warn-soft:#fff2db; --bad:#c62828; --bad-soft:#fde4e4;
  --info:#2457c5; --info-soft:#e5ecfb; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 96px}
header.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20}
header.top .in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;letter-spacing:.5px;background:var(--accent);color:#fff;border-radius:8px;padding:4px 8px;font-size:14px}
.top .title{font-weight:600;font-size:15px;line-height:1.2}
.top .sub{font-size:12px;opacity:.75}
.top .sp{flex:1}
h2{font-size:18px;margin:20px 0 10px}
h3{font-size:15px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:700px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#bdbab4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:42px}
textarea.i{min-height:70px}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:#eee;color:#333;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.punch{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:12px;margin:2px 4px 2px 0;background:#fff;font-variant-numeric:tabular-nums}
.punch.in{border-color:#bfe3cc} .punch.out{border-color:#f0c6b8} .punch.man{border-style:dashed}
button.punch{cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;background:#faf9f7;position:sticky;top:0}
.tbl td.who{min-width:190px}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}
.scroll .tbl th:first-child,.scroll .tbl td:first-child{padding-left:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
nav.bottom button.on{color:var(--accent)}
nav.bottom .ic{display:block;font-size:19px;line-height:1.2}
.status{border-radius:var(--radius);padding:18px;color:#fff;background:var(--ink)}
.status.in{background:linear-gradient(135deg,#1f8a4c,#166a3a)}
.status .big{font-size:22px;font-weight:700}
.hint{background:var(--info-soft);color:#1b3f8f;border-radius:12px;padding:12px 14px;font-size:14px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0}
.center{text-align:center}
.loading{padding:40px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #ddd;border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px}
@media(min-width:700px){.modal{border-radius:18px}}
.modal h3{margin-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
.daycard{border-bottom:1px solid var(--line);padding:10px 0}
.daycard:last-child{border-bottom:0}
.roster select{border:1px solid var(--line);border-radius:8px;padding:5px 4px;min-width:64px;background:#fff;font-size:13px}
.roster td.ph{background:#fff6f0}
.result{border-radius:20px;padding:28px 20px;text-align:center;color:#fff;margin:16px 0}
.result.in{background:var(--ok)} .result.out{background:var(--ink)} .result.fail{background:var(--bad)}
.result .big{font-size:30px;font-weight:800;margin:6px 0}
.result .time{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.steps div{padding:6px 0}
/* Kiosk */
body.kiosk{background:#111;color:#fff}
.k-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.k-name{font-size:28px;font-weight:800;text-align:center}
.k-clock{font-size:20px;opacity:.8;font-variant-numeric:tabular-nums}
.k-qr{background:#fff;border-radius:22px;padding:18px;width:min(78vw,62vh);aspect-ratio:1}
.k-qr img,.k-qr svg{width:100%;height:100%;display:block;image-rendering:pixelated}
.k-bar{width:min(78vw,62vh);height:6px;background:#333;border-radius:3px;overflow:hidden}
.k-bar i{display:block;height:100%;background:var(--accent);width:100%}
.k-help{font-size:17px;opacity:.85;text-align:center}
.k-recent{width:min(90vw,560px);font-size:15px}
.k-recent div{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #2a2a2a}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span>Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ===== SETUP: paste your Google Apps Script Web app link (ends with /exec) between the quotes ===== */
var API_URL = 'https://script.google.com/macros/s/AKfycbx8h0zBvk8FhNYIs10xQvXH0YIOtAcaMNgndfb7Gx7qe8tMVeoZh1l3LUVO9Go9FdebSw/exec';
</script>
<script>
(function(){
'use strict';
/* ---------------- helpers ---------------- */
var $app = document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function deviceId(){var d=store('sos_device');if(!d||d.length<16){d='D'+Date.now().toString(36)+Array.from(crypto.getRandomValues(new Uint8Array(12))).map(function(b){return b.toString(16).padStart(2,'0');}).join('');store('sos_device',d);}return d;}
var TOKEN=store('sos_token')||'';
var ST={me:null,boot:null,tab:'home',mtab:null};
var BOOT={mode:'app',company:'SOS Concept',baseUrl:location.origin+location.pathname};
function api(fn){var args=[].slice.call(arguments,1);
  if(!/^https?:\/\/.+\/exec$/.test(API_URL||''))return Promise.reject(new Error('Setup not finished: the Web app link has not been added to this page (API_URL).'));
  function once(){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),credentials:'omit',redirect:'follow',cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('Server error '+r.status);return r.text();})
    .then(function(t){var x;try{x=JSON.parse(t);}catch(e){throw new Error('Unexpected reply from server. Check the Web app link and that access is set to "Anyone".');}
      if(x&&x.error){var er=new Error(x.error);er.auth=x.auth;er.app=true;throw er;}return x;});}
  return once().catch(function(e){if(e.app)throw e;return new Promise(function(r){setTimeout(r,800);}).then(once);})
    .catch(function(e){if(e.app)throw e;throw new Error(/fetch|network|load/i.test(e.message)?'No connection to the server. Check your internet and try again.':e.message);});}
function call(fn){var a=[].slice.call(arguments);return api.apply(null,a).catch(function(e){if(e.auth){logout(e.message);throw e;}throw e;});}
function toast(msg){document.querySelectorAll('.toast').forEach(function(x){x.remove();});var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function hrs(h){h=+h||0;return (Math.round(h*100)/100).toFixed(h%1===0?0:(Math.round(h*10)===h*10?1:2));}
function mins2h(m){m=+m||0;return hrs(m/60);}
function todayStr(){return (ST.boot&&ST.boot.today)||new Date().toISOString().substr(0,10);}
function ymNow(){return (ST.boot&&ST.boot.periodYm)||todayStr().substr(0,7);}
function ymCompany(){return (ST.boot&&ST.boot.defaultPeriodYm)||ymNow();}
function fmtHM(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function shortD(d){var p=d.split('-');return (+p[2])+' '+MON[+p[1]-1];}
function periodText(p){return p?shortD(p.from)+' – '+shortD(p.to):'';}
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function niceDate(d){if(!d)return '';var p=d.split('-');var dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));return DOW[dt.getUTCDay()]+' '+(+p[2])+' '+MON[+p[1]-1];}
function niceYm(ym){var p=ym.split('-');return MON[+p[1]-1]+' '+p[0];}
function addDays(d,n){var p=d.split('-');var t=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n));return t.toISOString().substr(0,10);}
function addMonths(ym,n){var p=ym.split('-');var t=new Date(Date.UTC(+p[0],+p[1]-1+n,1));return t.toISOString().substr(0,7);}
function outletName(id){var o=(ST.boot&&ST.boot.outlets||[]).filter(function(x){return x.id===id;})[0];return o?o.name:(id||'');}
function shiftLabel(code){var s=(ST.boot&&ST.boot.shifts||[]).filter(function(x){return x.code===code;})[0];return s?s.name:code;}
function leaveName(code){var s=(ST.boot&&ST.boot.leaveTypes||[]).filter(function(x){return x.code===code;})[0];return s?s.name:code;}
function statusChip(d){
  var c='',t=d.status||'';
  if(t==='In')c='ok';else if(t==='Worked')c='ok';else if(t==='Absent'||t==='No check-out'||t==='Missed scan-out')c='bad';else if(t==='Leave'){c='info';t=leaveName(d.leave.code)+(d.leave.half?' (½)':'');}
  else if(t==='Public holiday'||t==='Rest day')c='';else if(t==='Not in yet')c='warn';
  var out=t?'<span class="chip '+c+'">'+esc(t)+'</span> ':'';
  if(d.late)out+='<span class="chip warn">Late '+d.lateMin+'m</span> ';
  if(d.otPending)out+='<span class="chip acc">OT pending '+mins2h(d.otPending)+'h</span> ';
  (d.longGaps||[]).forEach(function(g){out+='<span class="chip warn" title="'+esc(outletName(g.from))+' → '+esc(outletName(g.to))+'">Long gap '+fmtGap(g.gap)+'</span> ';});
  if(d.manualCount)out+='<span class="chip">✎ '+d.manualCount+' manual</span> ';
  if(d.earlyMin)out+='<span class="chip '+(d.earlyInReason?'info':'warn')+'" title="'+esc(d.earlyInReason?'Reason: '+d.earlyInReason.reason+' ('+d.earlyInReason.by+')':'Needs a reason from the supervisor')+'">Early in '+fmtGap(d.earlyMin)+(d.earlyInReason?' ✓':' – reason needed')+'</span> ';
  if(d.earlyOutMin)out+='<span class="chip '+(d.earlyOutReason?'info':'warn')+'" title="'+esc(d.earlyOutReason?'Reason: '+d.earlyOutReason.reason+' ('+d.earlyOutReason.by+')':'Needs a reason from the supervisor')+'">Early out '+fmtGap(d.earlyOutMin)+(d.earlyOutReason?' ✓':' – reason needed')+'</span> ';
  return out;
}
function fmtGap(m){m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m';}
function trailHtml(d){
  if(!d.trail||!d.trail.length)return '';
  return '<div class="tiny" style="margin-top:4px;line-height:1.7">'+d.trail.map(function(t){
    if(t.travel!==undefined)return '<span class="muted">→ travel '+fmtGap(t.travel)+(t.travel>t.credited?' (counted '+fmtGap(t.credited)+')':'')+' →</span>';
    return '<b>'+esc(outletName(t.outlet))+'</b> '+esc(t.inT)+'–'+(t.outT==='?'||(!t.outT&&d.noCheckout)?'<span style="color:var(--bad)">no scan-out</span>':esc(t.outT||'now'));}).join(' ')+'</div>';
}
function punchesHtml(ps,clickable){return (ps||[]).map(function(p){
  var cls='punch '+(p.type==='IN'?'in':'out')+(p.source==='Manual'?' man':'');
  var label=(p.type==='IN'?'▲ IN ':'▼ OUT ')+esc(p.time)+(p.source==='Manual'?' ✎':'');
  var title=outletName(p.outlet)+(p.dist?' · '+p.dist+'m':'')+(p.source==='Manual'?' · manual by '+p.by+': '+p.reason:'');
  return clickable?'<button class="'+cls+'" data-void="'+esc(p.id)+'" title="'+esc(title)+'">'+label+'</button>':'<span class="'+cls+'" title="'+esc(title)+'">'+label+'</span>';}).join('');}
function opts(list,sel){return list.map(function(o){var v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.l:o;return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>';}).join('');}
function outletOpts(sel,all){var list=(ST.boot.outlets||[]).filter(function(o){return !ST.me.managed||ST.me.managed.indexOf(o.id)>=0;}).map(function(o){return {v:o.id,l:o.name};});if(all)list.unshift({v:'',l:all});return opts(list,sel);}
function modal(html,onMount){var bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML='<div class="modal">'+html+'</div>';document.body.appendChild(bg);
  bg.addEventListener('click',function(e){if(e.target===bg)close();});function close(){bg.remove();}
  bg.querySelectorAll('[data-close]').forEach(function(b){b.onclick=close;});if(onMount)onMount(bg.querySelector('.modal'),close);return close;}
function confirmBox(title,msg,needReason,cb){
  modal('<h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p>'+(needReason?'<label class="f">Reason (required)</label><textarea class="i" id="cr"></textarea>':'')+
   '<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="cy">Confirm</button></div>',
   function(m,close){m.querySelector('#cy').onclick=function(){var r=needReason?m.querySelector('#cr').value.trim():'';if(needReason&&!r){toast('Please enter a reason');return;}close();cb(r);};});}
function busy(btn,on){if(!btn)return;if(on){btn.dataset.t=btn.innerHTML;btn.innerHTML='<span class="spin"></span>'+btn.dataset.t;btn.disabled=true;}else{btn.innerHTML=btn.dataset.t||btn.innerHTML;btn.disabled=false;}}
function errBox(e){return '<div class="err">'+esc(e.message||e)+'</div>';}
function loading(el){el.innerHTML='<div class="loading"><span class="spin"></span>Loading…</div>';}
function download(name,text,type){try{var b=new Blob([text],{type:type||'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},500);return true;}catch(e){return false;}}

/* ---------------- KIOSK ---------------- */
function kiosk(){
  document.body.className='kiosk';
  if(BOOT.error){$app.innerHTML='<div class="k-wrap"><div class="k-name">Outlet screen</div><div class="err">'+esc(BOOT.error)+'</div></div>';return;}
  var refresh=(BOOT.refreshSec||4)*1000, offset=BOOT.serverNow-Date.now();
  $app.innerHTML='<div class="k-wrap"><div class="k-name">'+esc(BOOT.outlet.name)+'</div><div class="k-clock" id="kc"></div>'+
    '<div class="k-qr" id="kq"></div><div class="k-bar"><i id="kb"></i></div>'+
    '<div class="k-help">Scan with your phone camera to <b>check in / check out</b></div><div class="k-recent" id="kr"></div></div>';
  var enc=new TextEncoder(), keyP=crypto.subtle.importKey('raw',enc.encode(BOOT.kioskSecret),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  var lastWin=-1;
  function hex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}
  function draw(url){
    if(typeof qrcode==='undefined'){document.getElementById('kq').innerHTML='<div style="color:#000;padding:20px">QR library failed to load. Check internet and reload.</div>';return;}
    var q=qrcode(0,'M');q.addData(url);q.make();
    document.getElementById('kq').innerHTML=q.createSvgTag({cellSize:8,margin:2,scalable:true});
  }
  function tick(){
    var now=Date.now()+offset, win=Math.floor(now/refresh);
    var left=1-((now%refresh)/refresh);
    document.getElementById('kb').style.width=(left*100)+'%';
    var d=new Date(now);
    document.getElementById('kc').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'Asia/Kuching'})+'  '+d.toLocaleTimeString('en-GB',{timeZone:'Asia/Kuching'});
    if(win!==lastWin){lastWin=win;keyP.then(function(k){return crypto.subtle.sign('HMAC',k,enc.encode(BOOT.outlet.id+'|'+win));}).then(function(sig){
      if(win!==lastWin)return;
      draw(BOOT.baseUrl+'?o='+encodeURIComponent(BOOT.outlet.id)+'&t='+win+'.'+hex(sig).substr(0,16));});}
  }
  tick();setInterval(tick,200);
  function recent(){api('apiKioskRecent',BOOT.outlet.id,BOOT.kioskKey).then(function(r){
    offset=r.serverNow-Date.now();
    document.getElementById('kr').innerHTML=(r.recent||[]).map(function(x){return '<div><span>'+esc(x.name)+'</span><span>'+(x.type==='IN'?'IN':'OUT')+' · '+esc(x.time)+'</span></div>';}).join('');
  }).catch(function(){});}
  recent();setInterval(recent,20000);
  // keep screen awake where supported
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}
  setTimeout(function(){location.reload();},6*3600*1000);
}

/* ---------------- LOGIN ---------------- */
function logout(msg){TOKEN='';store('sos_token',null);ST.me=null;ST.boot=null;renderLogin(msg);}
function renderLogin(msg,after){
  $app.innerHTML='<header class="top"><div class="in"><span class="logo">SOS</span><div><div class="title">'+esc(BOOT.company||'SOS Concept')+'</div><div class="sub">Staff Attendance</div></div></div></header>'+
   '<div class="wrap" style="max-width:420px">'+(BOOT.error?errBox(BOOT.error):'')+
   (after?'<div class="hint" style="margin-top:16px">Log in once on <b>your own phone</b> to record your attendance. This phone will be registered to you.</div>':'')+
   '<div class="card" style="margin-top:16px"><h2 style="margin-top:0">Log in</h2>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+
   '<label class="f">Staff ID</label><input class="i" id="lid" autocapitalize="characters" autocomplete="username">'+
   '<label class="f">PIN</label><input class="i" id="lpin" type="password" inputmode="numeric" autocomplete="current-password">'+
   '<div style="margin-top:16px"><button class="btn primary block" id="lgo">Log in</button></div>'+
   '<p class="small muted">Forgot your PIN? Ask admin to reset it.</p></div></div>';
  var go=document.getElementById('lgo');
  function submit(){var id=document.getElementById('lid').value.trim(),pin=document.getElementById('lpin').value.trim();if(!id||!pin){toast('Enter Staff ID and PIN');return;}

      if(r.me.mustChangePin)renderChangePin(true,after);else (after||start)();}).catch(function(e){busy(go,false);renderLogin(e.message,after);});}
  go.onclick=submit;document.getElementById('lpin').onkeydown=function(e){if(e.key==='Enter')submit();};
}
function renderChangePin(forced,after){
  var html='<h3>'+(forced?'Set your own PIN':'Change PIN')+'</h3>'+(forced?'<p class="small muted">For security, please replace the temporary PIN.</p>':'')+
   '<label class="f">Current PIN</label><input class="i" id="p0" type="password" inputmode="numeric">'+
   '<label class="f">New PIN (4–8 digits)</label><input class="i" id="p1" type="password" inputmode="numeric">'+
   '<label class="f">Repeat new PIN</label><input class="i" id="p2" type="password" inputmode="numeric">'+
   '<div class="row" style="margin-top:14px;justify-content:flex-end">'+(forced?'':'<button class="btn" data-close>Cancel</button>')+'<button class="btn primary" id="psave">Save PIN</button></div>';
  var done=function(){(after||start)();};
  if(forced){$app.innerHTML='<div class="wrap" style="max-width:420px"><div class="card" style="margin-top:20px">'+html+'</div></div>';bind($app,function(){});}
  else modal(html,bind);

    if(b!==c){toast('New PINs do not match');return;}var btn=this;busy(btn,true);
    api('apiChangePin',TOKEN,a,b).then(function(r){TOKEN=r.token;store('sos_token',TOKEN);toast('PIN updated');if(close)close();if(forced)done();}).catch(function(e){busy(btn,false);toast(e.message);});};}
}

/* ---------------- SCAN FLOW ---------------- */
function scanFlow(){
  var sc=BOOT.scan;
  var shell=function(inner){$app.innerHTML='<header class="top"><div class="in"><span class="logo">SOS</span><div><div class="title">Check in / out</div><div class="sub">'+esc(sc.outletName||'')+'</div></div></div></header><div class="wrap" style="max-width:460px">'+inner+'</div>';};
  if(!sc.ok){shell('<div class="result fail"><div class="big">Scan not accepted</div><div>'+esc(sc.error)+'</div></div><button class="btn block" id="home">Open my attendance</button>');
    document.getElementById('home').onclick=function(){BOOT.scan=null;start();};return;}
  if(!TOKEN){renderLogin('',scanFlow);return;}
  shell('<div class="card steps" id="st"><div><span class="spin"></span>Getting your location…</div></div>');
  var st=document.getElementById('st');
  function finish(geo){
    st.innerHTML='<div>✓ Location '+(geo?'found':'not available')+'</div><div><span class="spin"></span>Recording…</div>';
    api('apiPunch',TOKEN,sc.ticket,geo).then(function(r){
      var cls=r.type==='IN'?'in':'out';
      var head=r.duplicate?'Already recorded':(r.type==='IN'?'Checked IN':'Checked OUT');
      shell('<div class="result '+cls+'"><div>'+esc(r.name)+'</div><div class="big">'+head+'</div><div class="time">'+esc(r.time)+'</div><div>'+esc(r.outletName)+'</div></div>'+
        (r.registeredNow?'<div class="okmsg">This phone is now registered as your attendance phone.</div>':'')+
        (r.duplicate?'<div class="hint">You scanned again within a couple of minutes, so nothing new was recorded.</div>':'')+
        (r.otherOutlet&&!r.duplicate?'<div class="hint">Note: this is not your home outlet. It has been recorded.</div>':'')+
        (r.missedOutlet&&!r.duplicate?'<div class="err">You did not scan OUT when leaving <b>'+esc(r.missedOutlet)+'</b>. Your time there will not count until your manager adds the time you left. Remember to scan OUT before leaving each outlet.</div>':'')+
        (r.multi&&r.type==='OUT'&&!r.duplicate?'<div class="hint">Going to another outlet? Scan IN there when you arrive. Travel up to the allowed time is counted.</div>':'')+
        '<button class="btn block" id="home">View my attendance</button>');
      document.getElementById('home').onclick=function(){BOOT.scan=null;start();};
    }).catch(function(e){
      if(e.auth){renderLogin(e.message,scanFlow);return;}
      shell('<div class="result fail"><div class="big">Not recorded</div><div>'+esc(e.message)+'</div></div><button class="btn block" id="home">Open my attendance</button>');
      document.getElementById('home').onclick=function(){BOOT.scan=null;start();};
    });
  }
  if(!navigator.geolocation){finish(null);return;}
  navigator.geolocation.getCurrentPosition(function(p){finish({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});},
    function(err){
      if(err.code===1){shell('<div class="result fail"><div class="big">Location blocked</div><div>Please allow location for this page, then scan the outlet screen again.</div></div><div class="card small"><b>iPhone:</b> Settings → Privacy & Security → Location Services → Safari Websites → "While Using".<br><b>Android (Chrome):</b> tap the lock icon by the web address → Permissions → Location → Allow.</div>');return;}
      finish(null);},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

/* ---------------- MAIN APP ---------------- */
function start(){
  if(BOOT.mode==='kiosk'){kiosk();return;}
  if(BOOT.scan){scanFlow();return;}
  if(BOOT.error){renderLogin();return;}
  if(!TOKEN){renderLogin();return;}
  $app.innerHTML='<div class="loading"><span class="spin"></span>Loading…</div>';
  call('apiBoot',TOKEN).then(function(b){ST.boot=b;ST.me=b.me;if(b.me.mustChangePin){renderChangePin(true);return;}shell();}).catch(function(e){if(!e.auth)$app.innerHTML='<div class="wrap">'+errBox(e)+'<button class="btn" onclick="location.reload()">Retry</button></div>';});
}
function isMgr(){return ST.me&&(ST.me.role==='Admin'||ST.me.role==='OutletManager');}
function isViewer(){return ST.me&&(isMgr()||ST.me.role==='Accountant');}
function isAdmin(){return ST.me&&ST.me.role==='Admin';}
function shell(){
  var roleLabel={Admin:'Admin',OutletManager:'Outlet Manager',Accountant:'Accountant',Staff:''}[ST.me.role]||'';
  var tabs=[];
  if(ST.me.role!=='Accountant'&&ST.me.staffId!=='ADMIN')tabs=[['home','⌂','Home'],['history','☰','My month'],['leave','✈','Leave']];
  if(isViewer()||ST.me.canRoster)tabs.push(['manage','⚙',ST.me.role==='Accountant'?'Reports':(isViewer()?'Manage':'Team')]);
  tabs.push(['me','☺','Me']);
  if(!tabs.some(function(t){return t[0]===ST.tab;}))ST.tab=tabs[0][0];
  $app.innerHTML='<header class="top"><div class="in"><span class="logo">SOS</span><div><div class="title">'+esc(ST.me.name)+'</div><div class="sub">'+esc(ST.me.staffId)+' · '+esc(outletName(ST.me.outlet))+(roleLabel?' · '+roleLabel:'')+'</div></div><div class="sp"></div></div></header>'+
    '<div class="wrap" id="view"></div><nav class="bottom">'+tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(ST.tab===t[0]?'on':'')+'"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>';}).join('')+'</nav>';
  document.querySelectorAll('nav.bottom button').forEach(function(b){b.onclick=function(){ST.tab=b.dataset.t;document.querySelectorAll('nav.bottom button').forEach(function(x){x.classList.toggle('on',x===b);});route();};});
  route();
}
function route(){var v=document.getElementById('view');window.scrollTo(0,0);
  ({home:viewHome,history:viewHistory,leave:viewLeave,manage:viewManage,me:viewMe})[ST.tab](v);}

      '<h2 style="margin-bottom:2px">Payroll month: '+esc(niceYm(r.ym))+'</h2><div class="small muted" style="margin-bottom:10px">'+esc(periodText(r.period))+'</div><div class="grid g3">'+

          (d.outlet&&d.outlet!==ST.me.outlet?' <span class="chip info">'+esc(outletName(d.outlet))+'</span>':'')+'</div></div>';}).join('')+'</div>';
    v.innerHTML=html;
    var gc=document.getElementById('goConfirm');if(gc)gc.onclick=function(){ST.histYm=r.signoff.pendingYm;ST.tab='history';document.querySelectorAll('nav.bottom button').forEach(function(x){x.classList.toggle('on',x.dataset.t==='history');});route();};
    var sm=document.getElementById('seeMonth');if(sm)sm.onclick=function(e){e.preventDefault();ST.tab='history';document.querySelectorAll('nav.bottom button').forEach(function(x){x.classList.toggle('on',x.dataset.t==='history');});route();};

function monthStats(r){
  var past=r.days.filter(function(d){return d.date<=todayStr();});
  var late=past.filter(function(d){return d.late;}).length, eo=past.filter(function(d){return d.earlyOutMin;}).length, ab=past.filter(function(d){return d.absent;}).length;
  var lv=past.filter(function(d){return d.leave;}).reduce(function(a,d){return a+(d.leave.half?0.5:1);},0);
  var worked=past.filter(function(d){return d.punches.length;}).length;
  function rs(v,l,red){return '<div class="stat"><div class="v" style="'+(red&&v?'color:var(--bad)':'')+'">'+v+'</div><div class="l">'+l+'</div></div>';}
  return rs(worked,'Days worked')+rs(late,'Late',1)+rs(eo,'Left early',1)+rs(ab,'Absent',1)+rs(lv,'Leave days')+rs(r.days.filter(function(d){return d.date>todayStr()&&d.shift&&d.shift!=='OFF';}).length,'Shifts to go');
}
function shiftTimes(code){var s=(ST.boot.shifts||[]).filter(function(x){return x.code===code;})[0];return s?String(s.segments).replace(/,/g,' & '):'';}
function stat(v,l){return '<div class="stat"><div class="v">'+esc(v)+'</div><div class="l">'+esc(l)+'</div></div>';}

/* ---- Staff: History ---- */
function viewHistory(v){
  var ym=ST.histYm||ymNow();
  v.innerHTML='<div class="row" style="margin-top:16px"><button class="btn sm" id="hp">‹</button><div class="grow center"><h2 style="margin:0">'+esc(niceYm(ym))+'</h2><div class="small muted" id="hper">Payroll month</div></div><button class="btn sm" id="hn">›</button></div><div id="hb"></div>';
  document.getElementById('hp').onclick=function(){ST.histYm=addMonths(ym,-1);viewHistory(v);};
  document.getElementById('hn').onclick=function(){if(ym<addMonths(ymNow(),1)){ST.histYm=addMonths(ym,1);viewHistory(v);}};
  var hb=document.getElementById('hb');loading(hb);
  call('apiMyMonth',TOKEN,ym).then(function(r){
    var today=todayStr();
    document.getElementById('hper').textContent='Payroll month · '+periodText(r.period);
    function actual(d){
      if(!d.punches.length)return '';
      return d.punches.map(function(p){return '<span style="white-space:nowrap">'+(p.type==='IN'?'In ':'Out ')+esc(p.time)+(p.source==='Manual'?' ✎':'')+'</span>';}).join(' · ');
    }
    function remarks(d){
      var out=[];
      if(d.late)out.push('<div style="color:var(--bad);font-weight:600">Late '+fmtGap(d.lateMin)+(d.lateReason?' <span style="font-weight:400">– '+esc(d.lateReason.reason)+'</span>':'')+'</div>');
      if(d.earlyOutMin)out.push('<div style="color:var(--bad);font-weight:600">Left '+fmtGap(d.earlyOutMin)+' early'+(d.earlyOutReason?' <span style="font-weight:400">– '+esc(d.earlyOutReason.reason)+'</span>':'')+'</div>');
      if(d.earlyMin)out.push('<div>Came in '+fmtGap(d.earlyMin)+' early'+(d.earlyInReason?' – '+esc(d.earlyInReason.reason):'')+'</div>');
      if(d.absent)out.push('<div style="color:var(--bad);font-weight:600">Absent</div>');
      if(d.noCheckout)out.push('<div style="color:var(--bad);font-weight:600">'+(d.missedOut&&d.missedOut.length?'Missed scan-out':'No check-out')+' – please tell your supervisor</div>');
      if(d.leave)out.push('<div style="color:var(--info)">'+esc(leaveName(d.leave.code))+(d.leave.half?' (half day)':'')+(d.leave.reason?' – '+esc(d.leave.reason):'')+'</div>');
      if(d.holiday)out.push('<div style="color:var(--accent)">'+esc(d.holiday)+'</div>');
      (d.punches||[]).filter(function(p){return p.source==='Manual'&&p.reason;}).forEach(function(p){out.push('<div class="muted">✎ '+esc(p.type)+' '+esc(p.time)+' added by '+esc(p.by)+': '+esc(p.reason)+'</div>');});
      return out.join('');
    }
    var rows=r.days.map(function(d){
      var future=d.date>today, isT=d.date===today;
      var plan=d.shift==='OFF'?'<span class="muted">Rest day</span>':(d.shift?'<b>'+esc(d.shiftName)+'</b><div class="tiny muted">'+esc(d.planned||shiftTimes(d.shift))+'</div>':'<span class="muted">–</span>');
      return '<tr style="'+(isT?'background:#fff8f3':'')+(future?';opacity:.65':'')+'"><td style="white-space:nowrap"><b>'+esc(niceDate(d.date))+'</b>'+(isT?'<div class="tiny" style="color:var(--accent)">Today</div>':'')+'</td><td>'+plan+'</td><td class="small">'+(future?'':actual(d))+'</td><td class="small">'+(future?'':remarks(d))+'</td></tr>';
    }).join('');
    hb.innerHTML=confirmBoxHtml(r)+'<div class="grid g3" style="margin-top:12px">'+monthStats(r)+'</div>'+

      '<div class="scroll"><table class="tbl"><tr><th>Date</th><th>Duty roster</th><th>Actual scans</th><th>Remarks</th></tr>'+rows+'</table></div>';
    bindConfirm(r,function(){viewHistory(v);});
  }).catch(function(e){hb.innerHTML=errBox(e);});

function confirmBoxHtml(r){

  var head='',btns='<div class="row" style="margin-top:10px"><button class="btn ok" id="cfYes">✓ Yes, confirm</button><button class="btn" id="cfNo">Something is wrong</button></div>';

  if(so.status==='Query')return '<div class="card" style="border-color:var(--warn)"><b>Your message was sent to your supervisor:</b><div class="small" style="margin:6px 0">“'+esc(so.note)+'”</div><div class="small muted">Once it is fixed, you will be asked to confirm again.</div></div>';
  if(so.status==='Resolved')head='<b>Your supervisor replied:</b><div class="small" style="margin:6px 0">'+esc(so.note)+'</div><div>Please check the records below again. Is everything correct now?</div>';
  else head='<b>Is your attendance below correct?</b>';

}

/* ---- Month-end sign-off (supervisor / manager) ---- */
function mSignoff(v){
  var ym=ST.soYm||'';
  loading(v);
  call('apiSignoffOverview',TOKEN,ym).then(function(r){
    ST.soYm=r.ym;
    v.innerHTML='<div class="row" style="margin-bottom:6px"><button class="btn sm" id="sp">‹</button><b>Payroll '+esc(niceYm(r.ym))+'</b><button class="btn sm" id="sn">›</button></div>'+

      (r.outlets.length?r.outlets.map(card).join(''):'<div class="loading">No outlets.</div>');
    document.getElementById('sp').onclick=function(){ST.soYm=addMonths(r.ym,-1);mSignoff(v);};
    document.getElementById('sn').onclick=function(){ST.soYm=addMonths(r.ym,1);mSignoff(v);};
    bind(r);
  }).catch(function(e){v.innerHTML=errBox(e);});
  function tick(okv,txt,fix){return '<div class="row" style="padding:5px 0"><span style="width:20px;color:'+(okv?'var(--ok)':'var(--bad)')+';font-weight:700">'+(okv?'✓':'✗')+'</span><span class="grow small">'+txt+'</span>'+(fix&&!okv?fix:'')+'</div>';}
  function card(o){
    var status=o.approved?'<span class="chip ok">Approved – locked</span>':(o.verified?'<span class="chip info">Verified – waiting for manager</span>':(o.closed?'<span class="chip warn">Open</span>':'<span class="chip">Month not ended</span>'));
    var c=o.counts, n=o.staff.length;
    var staffRows=o.staff.map(function(x){
      var st=x.status==='Confirmed'?'<span class="chip ok">✓ Confirmed</span>':(x.status==='Query'?'<span class="chip bad">Query</span>':(x.status==='Resolved'?'<span class="chip info">Replied – waiting to re-confirm</span>':'<span class="chip">Not yet</span>'));
      var iss=[];if(x.issues.noCheckout)iss.push(x.issues.noCheckout+' no check-out');if(x.issues.unexplained)iss.push(x.issues.unexplained+' no reason');if(x.issues.otPending)iss.push(x.issues.otPending+'h OT pending');
      return '<div class="daycard"><div class="row"><b class="grow">'+esc(x.name)+' <span class="muted small">'+esc(x.staffId)+'</span></b>'+st+'</div>'+
        (iss.length?'<div class="tiny" style="color:var(--bad)">'+esc(iss.join(' · '))+'</div>':'')+
        (x.note?'<div class="small" style="margin-top:4px">“'+esc(x.note)+'”</div>':'')+
        (x.status==='Query'&&!o.approved?'<div class="row" style="margin-top:6px"><input class="i grow" placeholder="What did you do? e.g. Added 6pm check-out" data-rq="'+esc(o.outlet)+'|'+esc(x.staffId)+'"><button class="btn sm primary" data-rqb="'+esc(o.outlet)+'|'+esc(x.staffId)+'">Mark fixed</button></div>':'')+'</div>';}).join('');
    var go='<button class="btn sm" data-go="rec" data-o="'+esc(o.outlet)+'" data-f="'+o.period.from+'" data-t="'+o.period.to+'">Fix ›</button>';
    var goR='<button class="btn sm" data-go="flags" data-o="'+esc(o.outlet)+'" data-f="'+o.period.from+'" data-t="'+o.period.to+'">Give reasons ›</button>';
    var goOT='<button class="btn sm" data-go="ot">OT approvals ›</button>';
    return '<div class="card"><div class="row"><b class="grow" style="font-size:16px">'+esc(o.name)+'</b>'+status+'</div><div class="small muted">'+esc(periodText(o.period))+'</div>'+
      '<h3>1 · Staff confirmations <span class="muted small">('+o.confirmed+' of '+n+')</span></h3>'+
      '<details'+(o.openQueries?' open':'')+'><summary class="small" style="cursor:pointer">Show staff ('+n+')'+(o.openQueries?' – <b style="color:var(--bad)">'+o.openQueries+' query</b>':'')+'</summary>'+staffRows+'</details>'+

      '<h3>2 · Fix before verifying</h3>'+
      tick(!c.noCheckout,c.noCheckout?c.noCheckout+' missed check-out(s)':'No missed check-outs',go)+
      tick(!c.unexplained,c.unexplained?c.unexplained+' early in/out without a reason':'All early in/out have reasons',goR)+

/* ---- Roster ---- */
function mRoster(v){
  var allowed=isMgr()?ST.me.managed:(ST.me.role==='Accountant'?null:ST.me.rosterOutlets);
  var outs=(ST.boot.outlets||[]).filter(function(o){return !allowed||allowed.indexOf(o.id)>=0;});
  var outlet=ST.rOutlet||(outs[0]&&outs[0].id)||'';
  var week=ST.rWeek||todayStr();
  v.innerHTML='<div class="row"><select class="i" id="ro" style="max-width:260px">'+opts(outs.map(function(o){return {v:o.id,l:o.name};}),outlet)+'</select><button class="btn sm" id="rp">‹ Prev week</button><button class="btn sm" id="rn">Next week ›</button></div><div id="rb"></div>';
  document.getElementById('ro').onchange=function(){ST.rOutlet=this.value;mRoster(v);};
  var rb=document.getElementById('rb');loading(rb);
  call('apiRosterGet',TOKEN,outlet,week).then(function(r){
    ST.rWeek=r.dates[0];
    document.getElementById('rp').onclick=function(){ST.rWeek=addDays(r.dates[0],-7);mRoster(v);};
    document.getElementById('rn').onclick=function(){ST.rWeek=addDays(r.dates[0],7);mRoster(v);};
    var codes=[{v:'',l:'—'}].concat(ST.boot.shifts.map(function(s){return {v:s.code,l:s.code};}));
    var normal={};ST.boot.shifts.forEach(function(s){normal[s.code]=+s.normal||0;});
    function weekHrs(id){var t=0;r.dates.forEach(function(d){var sel=rb.querySelector('select[data-k="'+id+'|'+d+'"]');var c=sel?sel.value:r.entries[id+'|'+d];t+=normal[c]||0;});return t;}
    rb.innerHTML='<h3>Week of '+esc(niceDate(r.dates[0]))+'</h3><div class="scroll roster"><table class="tbl"><tr><th>Staff</th>'+r.dates.map(function(d){return '<th class="'+(r.holidays[d]?'ph':'')+'">'+esc(niceDate(d))+(r.holidays[d]?'<div class="tiny" style="color:var(--accent)">'+esc(r.holidays[d])+'</div>':'')+'</th>';}).join('')+(isAdmin()?'<th class="n">Hrs</th>':'')+'</tr>'+
      r.staff.map(function(s){return '<tr><td><b>'+esc(s.name)+'</b><div class="tiny muted">'+esc(s.position)+'</div></td>'+r.dates.map(function(d){var k=s.staffId+'|'+d;var lk=(r.lockUpTo&&d<=r.lockUpTo)||(r.lockedDates||[]).indexOf(d)>=0;var lv=(r.leave||{})[k];return '<td class="'+(r.holidays[d]?'ph':'')+'"><select data-k="'+esc(k)+'" '+(r.canEdit&&!lk?'':'disabled')+(lk?' title="Locked – ask your Outlet Manager to change"':'')+'>'+opts(codes,r.entries[k]||'')+'</select>'+(lv?'<div class="tiny" style="margin-top:3px"><span class="chip '+(lv.status==='Approved'?'info':'warn')+'" title="'+esc(lv.reason||'')+'">'+esc(lv.code)+(lv.half?' ½':'')+(lv.status==='Approved'?' leave':' pending')+'</span></div>':'')+'</td>';}).join('')+(isAdmin()?'<td class="n" data-h="'+esc(s.staffId)+'"></td>':'')+'</tr>';}).join('')+
      (r.sessions||[]).map(function(se,i){return '<tr style="background:#faf9f7"><td class="small" title="Staff on duty '+fmtHM(se.start)+'–'+fmtHM(se.end)+' (staff on leave not counted)"><b>'+esc(se.name)+'</b></td>'+r.dates.map(function(d){return '<td class="center"><b data-mp="'+i+'|'+d+'"></b></td>';}).join('')+(isAdmin()?'<td></td>':'')+'</tr>';}).join('')+'</table></div>'+

      (r.staff.length?'':'<div class="loading">No active staff in this outlet. Add staff under "Staff".</div>')+
      '<p class="tiny muted">'+ST.boot.shifts.filter(function(s){return s.code!=='OFF';}).map(function(s){return '<b>'+esc(s.code)+'</b> '+esc(String(s.segments).replace(/,/g,' & '));}).join(' · ')+'</p>'+
      (r.lockUpTo&&r.canEdit?'<p class="tiny muted">🔒 Today and earlier days are locked.</p>':'')+
      (r.canEdit?'<div class="row"><button class="btn" id="rc">Copy last week</button><div class="grow"></div><button class="btn primary" id="rs">Save roster</button></div>':'');
    var segOf={};ST.boot.shifts.forEach(function(s){segOf[s.code]=String(s.segments||'').split(',').map(function(x){var m=x.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);return m?[+m[1]*60+ +m[2],+m[3]*60+ +m[4]]:null;}).filter(Boolean);});
    function onDuty(code,se){return (segOf[code]||[]).some(function(g){return Math.min(g[1],se.end)-Math.max(g[0],se.start)>=60;});}

  call('apiStaffList',TOKEN).then(function(r){
    var qv=ST.staffQ||'';
    v.innerHTML='<div class="row"><input class="i grow" id="sq" placeholder="Search name, ID, outlet" value="'+esc(qv)+'" style="max-width:340px"><div class="grow"></div>'+(r.canEdit?'<button class="btn primary" id="sadd">+ Add staff</button>':'')+'</div><div id="sl"></div>';
    function draw(){var q=(document.getElementById('sq').value||'').toLowerCase();ST.staffQ=q;
      var list=r.staff.filter(function(s){return !q||(s.name+' '+s.staffId+' '+outletName(s.outlet)+' '+s.position).toLowerCase().indexOf(q)>=0;});
      document.getElementById('sl').innerHTML='<div class="scroll" style="margin-top:12px"><table class="tbl"><tr><th>Staff</th><th>Position</th><th>Outlet</th><th>Access</th><th>Phone</th><th></th></tr>'+
        list.map(function(s){return '<tr style="'+(s.active?'':'opacity:.5')+'"><td><b>'+esc(s.name)+'</b><div class="tiny muted">'+esc(s.staffId)+(s.active?'':' · inactive')+(s.joinDate?' · joined '+esc(s.joinDate):'')+'</div></td><td>'+esc(s.position)+'</td><td>'+esc(outletName(s.outlet))+(s.multi?' <span class="chip info">Multi-outlet</span>':'')+'</td><td>'+esc(({Staff:'Staff',OutletManager:'Outlet Manager',Accountant:'Accountant',Admin:'Admin'})[s.role])+(s.role==='OutletManager'&&s.managed?'<div class="tiny muted">'+esc(s.managed)+'</div>':'')+'</td>'+
          '<td>'+(s.hasDevice?'<span class="chip ok">Registered</span>':'<span class="chip">Not yet</span>')+(s.mustChangePin?'<div class="tiny muted">temp PIN</div>':'')+'</td><td><div class="row">'+(r.canEdit?'<button class="btn sm" data-ed="'+esc(s.staffId)+'">Edit</button><button class="btn sm" data-pin="'+esc(s.staffId)+'">Reset PIN</button>':'')+(r.canResetDevice&&s.hasDevice?'<button class="btn sm" data-dev="'+esc(s.staffId)+'">Reset phone</button>':'')+'</div></td></tr>';}).join('')+'</table></div>';
      bindRows();}
    function bindRows(){
      v.querySelectorAll('[data-ed]').forEach(function(b){b.onclick=function(){editStaff(r.staff.filter(function(s){return s.staffId===b.dataset.ed;})[0]);};});
      v.querySelectorAll('[data-pin]').forEach(function(b){b.onclick=function(){confirmBox('Reset PIN for '+b.dataset.pin+'?','A new temporary PIN will be shown. They must change it when they log in.',false,function(){call('apiStaffResetPin',TOKEN,b.dataset.pin).then(function(x){showPin(b.dataset.pin,x.tempPin);}).catch(function(e){toast(e.message);});});};});
      v.querySelectorAll('[data-dev]').forEach(function(b){b.onclick=function(){confirmBox('Reset phone for '+b.dataset.dev+'?','Their next login will register the phone they log in with.',false,function(){call('apiStaffResetDevice',TOKEN,b.dataset.dev).then(function(){toast('Phone reset');mStaff(v);}).catch(function(e){toast(e.message);});});};});
    }
    document.getElementById('sq').oninput=draw;draw();
    if(r.canEdit)document.getElementById('sadd').onclick=function(){editStaff(null);};
    function editStaff(s){var isNew=!s;s=s||{active:true,role:'Staff',outlet:(ST.boot.outlets[0]||{}).id};
      var pos=(ST.boot.positions||[]).slice();if(s.position&&pos.indexOf(s.position)<0)pos.push(s.position);
      modal('<h3>'+(isNew?'Add staff':'Edit '+esc(s.name))+'</h3><div class="grid g2"><div><label class="f">Staff ID</label><input class="i" id="e_id" value="'+esc(s.staffId||'')+'" '+(isNew?'':'disabled')+'></div><div><label class="f">Join date</label><input class="i" type="date" id="e_jd" value="'+esc(s.joinDate||'')+'"></div></div>'+
        '<label class="f">Full name</label><input class="i" id="e_nm" value="'+esc(s.name||'')+'">'+
        '<div class="grid g2"><div><label class="f">Job position</label><select class="i" id="e_ps">'+opts(pos,s.position)+'</select></div><div><label class="f">Branch / outlet</label><select class="i" id="e_ou">'+opts(ST.boot.outlets.map(function(o){return {v:o.id,l:o.name};}),s.outlet)+'</select></div></div>'+
        '<label class="f">Access in this app</label><select class="i" id="e_rl">'+opts(ROLES,s.role)+'</select>'+
        '<label class="row small" style="margin-top:10px"><input type="checkbox" id="e_mu" '+(s.multi?'checked':'')+'> Multi-outlet (works across outlets)</label>'+
        '<div id="e_mgw"><label class="f">Outlets this person looks after / arranges roster for <span class="muted">(none ticked = home outlet only)</span></label><div class="grid g2" id="e_mg">'+ST.boot.outlets.map(function(o){var on=(s.managed||'').split(',').indexOf(o.id)>=0;return '<label class="row small"><input type="checkbox" value="'+esc(o.id)+'" '+(on?'checked':'')+'> '+esc(o.name)+'</label>';}).join('')+'</div></div>'+
        '<label class="f">Phone number (optional)</label><input class="i" id="e_ph" value="'+esc(s.phone||'')+'">'+
        '<label class="f">Notes</label><input class="i" id="e_no" value="'+esc(s.notes||'')+'">'+
        '<label class="row small" style="margin-top:10px"><input type="checkbox" id="e_ac" '+(s.active?'checked':'')+'> Active (untick when staff resigns)</label>'+
        '<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="e_sv">Save</button></div>',
        function(m,close){var rl=m.querySelector('#e_rl');var ps=m.querySelector('#e_ps');function tog(){var pi=(ST.boot.positionsInfo||[]).filter(function(p){return p.name===ps.value;})[0];m.querySelector('#e_mgw').style.display=(rl.value==='OutletManager'||(rl.value==='Staff'&&pi&&pi.canRoster))?'':'none';}rl.onchange=tog;ps.onchange=tog;tog();
          m.querySelector('#e_sv').onclick=function(){var btn=this;busy(btn,true);
            var managed=[].map.call(m.querySelectorAll('#e_mg input:checked'),function(i){return i.value;}).join(',');
            call('apiStaffSave',TOKEN,{staffId:m.querySelector('#e_id').value,name:m.querySelector('#e_nm').value,position:m.querySelector('#e_ps').value,outlet:m.querySelector('#e_ou').value,role:rl.value,managed:managed,joinDate:m.querySelector('#e_jd').value,phone:m.querySelector('#e_ph').value,notes:m.querySelector('#e_no').value,active:m.querySelector('#e_ac').checked,multi:m.querySelector('#e_mu').checked},isNew)
            .then(function(x){close();if(x.tempPin)showPin(m.querySelector('#e_id').value.toUpperCase(),x.tempPin);else toast('Saved');mStaff(v);}).catch(function(e){busy(btn,false);toast(e.message);});};});}
  }).catch(function(e){v.innerHTML=errBox(e);});
}
function showPin(id,pin){modal('<h3>Temporary PIN</h3><p>Give these to the staff member. They will set their own PIN at first login.</p><div class="card center"><div class="small muted">Staff ID</div><div style="font-size:22px;font-weight:800">'+esc(id)+'</div><div class="small muted" style="margin-top:8px">Temporary PIN</div><div style="font-size:32px;font-weight:800;letter-spacing:4px">'+esc(pin)+'</div></div><button class="btn primary block" data-close>Done</button>');}

/* ---- Outlets ---- */
function mOutlets(v){
  loading(v);
  call('apiOutlets',TOKEN).then(function(r){
    r.outlets.forEach(function(o){o.kioskUrl=o.kioskKey?BOOT.baseUrl+'?page=kiosk&o='+encodeURIComponent(o.id)+'&k='+encodeURIComponent(o.kioskKey):'';});
    v.innerHTML=''+
      (r.canEdit?'<div class="row" style="margin:12px 0"><div class="grow"></div><button class="btn primary" id="oadd">+ Add outlet</button></div>':'')+
      r.outlets.map(function(o){return '<div class="card"><div class="row"><b class="grow">'+esc(o.name)+' <span class="muted small">'+esc(o.id)+'</span></b>'+(o.active?'':'<span class="chip">Inactive</span>')+(o.lat?'<span class="chip ok">Location set</span>':'<span class="chip bad">Location not set</span>')+'</div>'+
        '<div class="small muted">'+(o.lat?esc(o.lat)+', '+esc(o.lng)+' · radius '+esc(o.radius||r.defaultRadius)+' m':'Staff cannot check in here until the location is set.')+' · hours '+esc(o.openTime||'10:00')+'–'+esc(o.closeTime||'22:00')+' · cut-off day '+esc(o.cutoffDay||((ST.boot&&ST.boot.cutoffDefault)||23))+'</div>'+
        '<div class="row" style="margin-top:10px">'+(o.kioskUrl?'<a class="btn sm" href="'+esc(o.kioskUrl)+'" target="_blank">Open outlet screen</a><button class="btn sm" data-copy="'+esc(o.kioskUrl)+'">Copy screen link</button>':'')+(r.canEdit?'<button class="btn sm" data-oe="'+esc(o.id)+'">Edit</button>':'')+'</div></div>';}).join('');
    v.querySelectorAll('[data-copy]').forEach(function(b){b.onclick=function(){var t=b.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Link copied');}).catch(function(){modal('<h3>Outlet screen link</h3><textarea class="i" style="min-height:120px">'+esc(t)+'</textarea><button class="btn block" data-close style="margin-top:10px">Close</button>');});};});
    v.querySelectorAll('[data-oe]').forEach(function(b){b.onclick=function(){edit(r.outlets.filter(function(o){return o.id===b.dataset.oe;})[0]);};});
    if(r.canEdit)document.getElementById('oadd').onclick=function(){edit(null);};
    function edit(o){var isNew=!o;o=o||{active:true};
      modal('<h3>'+(isNew?'Add outlet':'Edit '+esc(o.name))+'</h3><div class="grid g2"><div><label class="f">Code</label><input class="i" id="o_id" value="'+esc(o.id||'')+'" autocapitalize="characters"></div><div><label class="f">Radius (m)</label><input class="i" id="o_r" inputmode="numeric" value="'+esc(o.radius||'')+'" placeholder="'+esc(r.defaultRadius)+'"></div></div>'+
        '<label class="f">Name</label><input class="i" id="o_nm" value="'+esc(o.name||'')+'">'+
        '<label class="f">Business hours <span class="muted">(blank = 10:00 to 22:00)</span></label><div class="grid g2"><input class="i" id="o_op" value="'+esc(o.openTime||'')+'" placeholder="Opens 10:00"><input class="i" id="o_ct" value="'+esc(o.closeTime||'')+'" placeholder="Closes 22:00"></div>'+
        '<p class="tiny muted" style="margin:4px 0 0">Late is counted from the later of shift start and opening time; early out from the earlier of shift end and closing time.</p>'+
        '<label class="f">Payroll cut-off day <span class="muted">(blank = company default, day '+esc((ST.boot&&ST.boot.cutoffDefault)||23)+')</span></label><input class="i" id="o_cd" inputmode="numeric" value="'+esc(o.cutoffDay||'')+'" placeholder="'+esc((ST.boot&&ST.boot.cutoffDefault)||23)+'">'+
        (isNew?'':'<p class="tiny muted" style="margin:4px 0 0">Changing the <b>code</b> updates all staff, rosters and records, and gives the outlet screen a new link – reopen the outlet screen afterwards.</p>')+
        '<div class="grid g2"><div><label class="f">Latitude</label><input class="i" id="o_lat" value="'+esc(o.lat||'')+'"></div><div><label class="f">Longitude</label><input class="i" id="o_lng" value="'+esc(o.lng||'')+'"></div></div>'+
        '<button class="btn block" id="o_geo" style="margin-top:10px">📍 Use my current location</button><div id="o_gm" class="small muted"></div>'+
        '<label class="row small" style="margin-top:10px"><input type="checkbox" id="o_ac" '+(o.active?'checked':'')+'> Active</label>'+
        (isNew?'':'<label class="row small" style="margin-top:6px"><input type="checkbox" id="o_nk"> Make a new outlet screen link (the old link stops working)</label>')+
        '<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="o_sv">Save</button></div>',
        function(m,close){
          m.querySelector('#o_geo').onclick=function(){var gm=m.querySelector('#o_gm');gm.textContent='Getting location…';
            navigator.geolocation.getCurrentPosition(function(p){m.querySelector('#o_lat').value=p.coords.latitude.toFixed(6);m.querySelector('#o_lng').value=p.coords.longitude.toFixed(6);gm.textContent='Accuracy about '+Math.round(p.coords.accuracy)+' m. If it is more than 50 m, step near the shop front and try again.';},
              function(e){gm.textContent='Could not get location: '+e.message;},{enableHighAccuracy:true,timeout:20000,maximumAge:0});};
          m.querySelector('#o_sv').onclick=function(){var btn=this;busy(btn,true);var nk=m.querySelector('#o_nk');
            var newId=m.querySelector('#o_id').value.trim().toUpperCase();
            var first=(!isNew&&newId!==o.id)?call('apiOutletRename',TOKEN,o.id,newId):Promise.resolve();
            first.then(function(){return call('apiOutletSave',TOKEN,{id:newId,name:m.querySelector('#o_nm').value,lat:m.querySelector('#o_lat').value.trim(),lng:m.querySelector('#o_lng').value.trim(),radius:m.querySelector('#o_r').value.trim(),openTime:m.querySelector('#o_op').value.trim(),cutoffDay:m.querySelector('#o_cd').value.trim(),closeTime:m.querySelector('#o_ct').value.trim(),active:m.querySelector('#o_ac').checked,newKey:nk&&nk.checked},isNew);})
            .then(function(){close();toast('Saved');call('apiBoot',TOKEN).then(function(b){ST.boot=b;});mOutlets(v);}).catch(function(e){busy(btn,false);toast(e.message);});};});}
  }).catch(function(e){v.innerHTML=errBox(e);});
}

/* ---- Setup tables ---- */
var TABLE_HELP={
  Settings:'General rules. Change the Value column only. CutoffDay = payroll cut-off (23 means the July payroll covers 24 June to 23 July); each outlet can override it under Outlets.',
  Positions:'OTCapWeeklyHrs: weekly OT allowed automatically (blank = no cap, 0 = none). OTNeedsApproval: Y = every OT hour needs a manager decision. CanArrangeRoster: Y = staff in this position can arrange the duty roster for their outlet(s), for tomorrow onwards only.',
  Shifts:'Segments: working hours, e.g. 10:00-18:00 or 10:00-14:00,18:00-22:00. NormalHours: hours before OT starts. OTAllowed: N = no OT on this shift. Keep the OFF code for rest days.',
  LeaveTypes:'Paid: Y = uses entitlement balance and counts as worked hours. N = unpaid (no balance needed).',
  Holidays:'Your own public holiday list. Date as YYYY-MM-DD. ReplacementLeave: Y = you can grant replacement days for this holiday.'
};
function mSetup(v){
  var t=ST.setT||'Holidays';
  v.innerHTML='<div class="tabs">'+['Holidays','Shifts','Positions','LeaveTypes','Settings','Archive'].map(function(n){return '<button class="tab '+(t===n?'on':'')+'" data-st="'+n+'">'+(({LeaveTypes:'Leave types',Archive:'Yearly archive'})[n]||n)+'</button>';}).join('')+'</div><div id="sb"></div>';
  v.querySelectorAll('[data-st]').forEach(function(b){b.onclick=function(){ST.setT=b.dataset.st;mSetup(v);};});
  var sb=document.getElementById('sb');loading(sb);
  if(t==='Archive')return mArchive(sb,v);
  call('apiTableGet',TOKEN,t).then(function(r){
    var rows=r.rows.map(function(x){return x.slice();});
    function draw(){sb.innerHTML='<p class="small muted">'+esc(TABLE_HELP[t])+'</p><div class="scroll"><table class="tbl"><tr>'+r.headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'<th></th></tr>'+
      rows.map(function(row,i){return '<tr>'+r.headers.map(function(h,j){var ro=t==='Settings'&&j!==1;return '<td><input class="i" style="min-height:34px;padding:5px 8px;min-width:'+(j===0?90:110)+'px" data-c="'+i+'|'+j+'" value="'+esc(row[j]||'')+'" '+(ro||!r.canEdit?'disabled':'')+'></td>';}).join('')+'<td>'+(t!=='Settings'&&r.canEdit?'<button class="btn sm bad" data-del="'+i+'">✕</button>':'')+'</td></tr>';}).join('')+'</table></div>'+
      (r.canEdit?'<div class="row" style="margin-top:10px">'+(t!=='Settings'?'<button class="btn" id="tadd">+ Add row</button>':'')+'<div class="grow"></div><button class="btn primary" id="tsave">Save '+esc(t)+'</button></div>':'');
      sb.querySelectorAll('[data-c]').forEach(function(inp){inp.oninput=function(){var k=inp.dataset.c.split('|');rows[+k[0]][+k[1]]=inp.value;};});
      sb.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){rows.splice(+b.dataset.del,1);draw();};});
      var a=document.getElementById('tadd');if(a)a.onclick=function(){rows.push(r.headers.map(function(){return '';}));draw();};
      var s=document.getElementById('tsave');if(s)s.onclick=function(){busy(s,true);call('apiTableSave',TOKEN,t,rows).then(function(){toast('Saved');call('apiBoot',TOKEN).then(function(b){ST.boot=b;});busy(s,false);}).catch(function(e){busy(s,false);toast(e.message);});};}
    draw();
  }).catch(function(e){sb.innerHTML=errBox(e);});
}

/* ---- Archive ---- */
function mArchive(sb,v){
  call('apiArchiveInfo',TOKEN).then(function(r){
    sb.innerHTML='<div class="card"><p class="small">Archiving moves a <b>past year\'s</b> scans into a separate Google Sheet file in your Google Drive, so the app stays fast. <b>Nothing is deleted.</b> Reports for archived years still work as normal, and you can open the archive file anytime. Do this once a year, in January.</p></div>'+
      '<h3>Scans in the main sheet</h3><div class="scroll"><table class="tbl"><tr><th>Year</th><th class="n">Scans</th><th></th></tr>'+
      (r.inMain.length?r.inMain.map(function(y){return '<tr><td><b>'+esc(y.year)+'</b></td><td class="n">'+y.rows+'</td><td>'+(y.canArchive?'<button class="btn sm dark" data-ay="'+esc(y.year)+'">Archive '+esc(y.year)+'</button>':'<span class="tiny muted">Current year – archive next January</span>')+'</td></tr>';}).join(''):'<tr><td colspan="3" class="muted">No scans yet.</td></tr>')+'</table></div>'+
      '<h3>Archive files</h3><div class="scroll"><table class="tbl"><tr><th>Year</th><th class="n">Scans</th><th>Archived</th><th></th></tr>'+
      (r.archives.length?r.archives.map(function(a){return '<tr><td><b>'+esc(a.year)+'</b></td><td class="n">'+esc(a.rows)+'</td><td class="small">'+esc(a.createdAt)+' by '+esc(a.by)+'</td><td><a class="btn sm" href="'+esc(a.url)+'" target="_blank">Open file</a></td></tr>';}).join(''):'<tr><td colspan="4" class="muted">No archives yet.</td></tr>')+'</table></div>';
    sb.querySelectorAll('[data-ay]').forEach(function(b){b.onclick=function(){var y=b.dataset.ay;
      confirmBox('Archive '+y+'?','All '+y+' scans will be copied to a new Google Sheet file named "… Archive '+y+'" and then removed from the main sheet. Reports for '+y+' will still work. This can take a minute.',false,function(){
        busy(b,true);call('apiArchiveYear',TOKEN,y).then(function(x){toast('Archived '+x.moved+' scans');mArchive(sb,v);}).catch(function(e){busy(b,false);toast(e.message);});});};});
  }).catch(function(e){sb.innerHTML=errBox(e);});
}

/* ---- Log ---- */
function mLog(v){loading(v);call('apiAudit',TOKEN).then(function(r){
  v.innerHTML='<p class="small muted">Last 200 changes. The full log is in the "Audit" tab of the Google Sheet.</p><div class="scroll"><table class="tbl"><tr><th>When</th><th>By</th><th>Action</th><th>Details</th></tr>'+r.rows.map(function(x){return '<tr><td class="tiny">'+esc(x.Timestamp)+'</td><td>'+esc(x.By)+'</td><td><span class="chip">'+esc(x.Action)+'</span></td><td class="small">'+esc(x.Details)+'</td></tr>';}).join('')+'</table></div>';
}).catch(function(e){v.innerHTML=errBox(e);});}

function bootFromUrl(){
  var q=new URLSearchParams(location.search);
  if(q.get('page')==='kiosk'){
    BOOT.mode='kiosk';
    api('apiKioskBoot',q.get('o')||'',q.get('k')||'').then(function(r){r.mode='kiosk';r.baseUrl=BOOT.baseUrl;r.kioskKey=q.get('k');BOOT=r;start();})
      .catch(function(e){BOOT.error=e.message;start();});
    return;
  }
  if(q.get('o')&&q.get('t')){
    $app.innerHTML='<div class="loading"><span class="spin"></span>Checking the QR code…</div>';
    api('apiScanCheck',q.get('o'),q.get('t')).then(function(r){BOOT.scan=r;if(r.company)BOOT.company=r.company;})
      .catch(function(e){BOOT.scan={ok:false,error:e.message};})
      .then(function(){try{history.replaceState(null,'',BOOT.baseUrl);}catch(e){}start();});
    return;
  }
  start();
}
bootFromUrl();
})();
</script>
